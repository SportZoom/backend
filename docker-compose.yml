services:
  postgres: 
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sportzoom_user 
      - POSTGRES_PASSWORD=ClaveSportzoom123
      - POSTGRES_DB=sportzoom 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:  
      PGADMIN_DEFAULT_EMAIL: "admin@sportzoom.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "80:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
